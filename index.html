<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balloon Game</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b1020;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        width: min(900px, 94vw);
        text-align: center;
      }

      h1 {
        font-size: clamp(42px, 8vw, 82px);
        margin: 0 0 10px;
        letter-spacing: -3px;
      }

      .status {
        color: #aeb8d0;
        font-size: 18px;
        margin-bottom: 28px;
      }

      .battery {
        margin: -18px 0 22px;
        color: #aeb8d0;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 16px 28px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        background: #ffffff;
        color: #0b1020;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .game {
        margin-top: 30px;
        border-radius: 28px;
        min-height: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #151d35;
        transition: 0.2s;
      }

      .state {
        font-size: clamp(44px, 9vw, 90px);
        font-weight: 900;
        margin: 0;
      }

      .substate {
        margin-top: 14px;
        font-size: 22px;
        color: #b9c3d9;
      }

      .timer {
        margin-top: 25px;
        font-size: 72px;
        font-weight: 900;
        display: none;
      }

      .score {
        margin-top: 30px;
        font-size: 22px;
        color: #aeb8d0;
      }

      .score span {
        color: white;
        font-weight: 800;
      }

      .log {
        margin-top: 20px;
        font-family: monospace;
        font-size: 13px;
        color: #74809b;
        min-height: 20px;
      }

      .game.over {
        background: #42151b;
      }

      .game.over .state {
        color: #ff5c69;
      }

      .game.ready .state {
        color: #65e6a5;
      }

      .game.waiting .state {
        color: #ffd166;
      }
    </style>
  </head>

  <body>
    <main class="app">
      <h1>BALLOON GAME</h1>
      <div id="status" class="status">XIAO not connected</div>
      <div id="battery" class="battery">Battery: --</div>

      <button id="connectButton">Connect Balloon</button>

      <section id="game" class="game waiting">
        <div id="state" class="state">WAITING</div>
        <div id="substate" class="substate">
          Connect the balloon controller to start.
        </div>
        <div id="timer" class="timer">10</div>
        <div class="score">Ground hits: <span id="score">0</span></div>
        <div id="log" class="log"></div>
      </section>
    </main>

    <script>
      const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";

      const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

      // Custom battery characteristic defined in the Arduino sketch.
      const BATTERY_CHARACTERISTIC_UUID =
        "19b10002-e8f2-537e-4f6c-d104768a1214";

      const DEVICE_NAME = "BalloonGame";

      const connectButton = document.getElementById("connectButton");
      const statusText = document.getElementById("status");
      const batteryText = document.getElementById("battery");
      const game = document.getElementById("game");
      const state = document.getElementById("state");
      const substate = document.getElementById("substate");
      const timer = document.getElementById("timer");
      const scoreElement = document.getElementById("score");
      const logElement = document.getElementById("log");

      let device = null;
      let characteristic = null;
      let batteryCharacteristic = null;
      let score = 0;
      let resetTimeout = null;
      let countdownInterval = null;
      let hitFeedbackTimeout = null;

      connectButton.addEventListener("click", connectBalloon);

      async function connectBalloon() {
        if (!navigator.bluetooth) {
          statusText.textContent =
            "Bluetooth unavailable. Open in Chrome or Edge over HTTPS or localhost.";
          return;
        }

        statusText.textContent = "Connecting...";
        connectButton.disabled = true;

        try {
          device = await navigator.bluetooth.requestDevice({
            filters: [{ name: DEVICE_NAME }],
            optionalServices: [SERVICE_UUID],
          });

          device.addEventListener("gattserverdisconnected", handleDisconnect);

          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);

          // Connect to game-event characteristic.
          characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

          characteristic.addEventListener(
            "characteristicvaluechanged",
            handleBluetoothEvent,
          );

          await characteristic.startNotifications();

          // Connect to battery characteristic on the SAME service.
          batteryCharacteristic = await service.getCharacteristic(
            BATTERY_CHARACTERISTIC_UUID,
          );

          batteryCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleBatteryUpdate,
          );

          // Read the current battery percentage immediately.
          const initialBattery = await batteryCharacteristic.readValue();

          updateBatteryLevel(initialBattery);

          // Subscribe to subsequent battery updates.
          await batteryCharacteristic.startNotifications();

          statusText.textContent = "CONNECTED";
          connectButton.textContent = "Connected";
          showKeepItUp();
        } catch (error) {
          console.error(error);

          statusText.textContent = `Connection failed: ${error.message || error.name || "Error"}`;

          connectButton.disabled = false;
          connectButton.textContent = "Connect Balloon";
        }
      }

      function handleBluetoothEvent(event) {
        const decoder = new TextDecoder();

        const message = decoder
          .decode(event.target.value)
          .replace(/\0/g, "")
          .trim();

        console.log("BLE:", message);
        logElement.textContent = `Controller event: ${message}`;

        if (message === "GROUND_HIT") {
          showGameOver();
        } else if (message === "PLAYER_HIT") {
          showPersonHit();
        } else if (message === "RESET") {
          showKeepItUp();
        } else if (message === "READY") {
          showKeepItUp();
        }
      }

      function handleBatteryUpdate(event) {
        updateBatteryLevel(event.target.value);
      }

      function updateBatteryLevel(value) {
        // Arduino sends one unsigned byte containing 0–100.
        const percent = value.getUint8(0);

        batteryText.textContent = `Battery: ${percent}%`;

        console.log("Battery:", `${percent}%`);
      }

      function showGameOver() {
        if (game.classList.contains("over")) {
          return;
        }

        clearTimeout(hitFeedbackTimeout);
        clearTimeout(resetTimeout);
        clearInterval(countdownInterval);

        score++;
        scoreElement.textContent = score;

        game.className = "game over";

        state.textContent = "GAME OVER";
        substate.textContent = "THE BALLOON HIT THE GROUND";

        timer.style.display = "block";

        let seconds = 10;
        timer.textContent = seconds;

        countdownInterval = setInterval(() => {
          seconds--;

          if (seconds > 0) {
            timer.textContent = seconds;
          }
        }, 1000);

        resetTimeout = setTimeout(() => {
          clearInterval(countdownInterval);
          countdownInterval = null;

          showKeepItUp();
        }, 10000);
      }

      function showPersonHit() {
        if (!game.classList.contains("ready")) {
          return;
        }

        clearTimeout(hitFeedbackTimeout);

        state.textContent = "NICE HIT!";
        substate.textContent = "BALLOON HIT BY A PLAYER";

        hitFeedbackTimeout = setTimeout(() => {
          if (game.classList.contains("ready")) {
            state.textContent = "KEEP IT UP!";
            substate.textContent =
              "Hit the balloon. Don't let it touch the ground.";
          }

          hitFeedbackTimeout = null;
        }, 1200);
      }

      function showKeepItUp() {
        clearTimeout(hitFeedbackTimeout);
        hitFeedbackTimeout = null;

        clearTimeout(resetTimeout);
        clearInterval(countdownInterval);

        resetTimeout = null;
        countdownInterval = null;

        timer.style.display = "none";

        game.className = "game ready";

        state.textContent = "KEEP IT UP!";

        substate.textContent =
          "Hit the balloon. Don't let it touch the ground.";
      }

      function handleDisconnect() {
        characteristic = null;
        batteryCharacteristic = null;

        statusText.textContent = "XIAO disconnected";
        batteryText.textContent = "Battery: --";

        connectButton.disabled = false;
        connectButton.textContent = "Reconnect Balloon";

        clearTimeout(hitFeedbackTimeout);
        clearTimeout(resetTimeout);
        clearInterval(countdownInterval);

        timer.style.display = "none";

        game.className = "game waiting";
        state.textContent = "DISCONNECTED";
        substate.textContent = "Reconnect the balloon controller.";
      }
    </script>
  </body>
</html>
